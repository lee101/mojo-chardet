[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mojo-chardet"
version = "0.1.0"
description = "Fast charset detection kernels in Mojo"
requires-python = ">=3.10"
dependencies = ["numpy"]
license = "MIT"

[tool.setuptools]
package-dir = {"" = "python"}

[tool.setuptools.packages.find]
where = ["python"]
